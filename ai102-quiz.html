<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-102 Azure AI Services 基礎クイズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Meiryo,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column}

/* Header */
header{background:linear-gradient(135deg,#0078d4 0%,#00bcf2 100%);padding:28px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,120,212,.3)}
header h1{font-size:1.7rem;font-weight:700;color:#fff;letter-spacing:.02em}
header p{color:rgba(255,255,255,.85);margin-top:6px;font-size:.95rem}

/* Main wrapper */
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.quiz-wrapper{width:100%;max-width:720px}

/* Progress section */
.progress-section{background:#fff;border-radius:12px 12px 0 0;padding:20px 24px 16px;box-shadow:0 1px 0 #e2e8f0}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-size:.88rem;color:#555;font-weight:600}
.progress-counter{font-size:.88rem;color:#0078d4;font-weight:700}
.progress-bar-wrap{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#0078d4,#00bcf2);border-radius:3px;transition:width .4s ease}

/* Question card */
.question-card{background:#fff;padding:28px 28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:0 0 12px 12px;border-top:1px solid #e2e8f0}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.q-badge{background:#0078d4;color:#fff;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px}
.q-category{font-size:.78rem;color:#888;background:#f0f4f8;padding:3px 10px;border-radius:20px}
.q-text{font-size:1.05rem;line-height:1.7;color:#1a1a2e;font-weight:500;margin-bottom:22px}

/* Options */
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;background:#fafbfc;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;font-family:inherit;font-size:.95rem;color:#333;line-height:1.5}
.option-btn:hover:not(:disabled){border-color:#0078d4;background:#eff6ff;transform:translateX(2px)}
.option-key{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;border:2px solid #c0cfe0;font-weight:700;font-size:.82rem;color:#555;flex-shrink:0;transition:all .15s}
.option-btn:hover:not(:disabled) .option-key{border-color:#0078d4;color:#0078d4}
.option-text{padding-top:2px}

/* Answered states */
.option-btn.correct{border-color:#107c10;background:#f0fff0;cursor:default}
.option-btn.correct .option-key{border-color:#107c10;background:#107c10;color:#fff}
.option-btn.wrong{border-color:#d13438;background:#fff0f0;cursor:default}
.option-btn.wrong .option-key{border-color:#d13438;background:#d13438;color:#fff}
.option-btn.neutral{border-color:#e2e8f0;background:#fafbfc;cursor:default;opacity:.65}
.option-btn:disabled{cursor:default;transform:none}

/* Result badge */
.result-badge{display:none;align-items:center;gap:8px;margin-top:20px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:.92rem}
.result-badge.show{display:flex}
.result-badge.ok{background:#dff6dd;color:#107c10;border:1px solid #a8d8a8}
.result-badge.ng{background:#fde7e9;color:#d13438;border:1px solid #f3a9ab}
.result-icon{font-size:1.2rem}

/* Explanation */
.explanation{display:none;margin-top:12px;padding:14px 16px;background:#f0f7ff;border-left:4px solid #0078d4;border-radius:0 8px 8px 0;font-size:.88rem;line-height:1.7;color:#333}
.explanation.show{display:block}
.explanation strong{color:#0078d4}

/* Navigation */
.nav-section{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .2s;font-family:inherit}
.btn-prev{background:#fff;border-color:#0078d4;color:#0078d4}
.btn-prev:hover:not(:disabled){background:#eff6ff}
.btn-prev:disabled{border-color:#c0cfe0;color:#aab;cursor:default}
.btn-next{background:#0078d4;color:#fff}
.btn-next:hover:not(:disabled){background:#006cbf}
.btn-next:disabled{background:#c0cfe0;cursor:default}
.nav-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.nav-dot{width:10px;height:10px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:all .2s;border:none;padding:0}
.nav-dot.answered{background:#00bcf2}
.nav-dot.current{background:#0078d4;transform:scale(1.3)}
.nav-dot.correct{background:#107c10}
.nav-dot.wrong{background:#d13438}

/* Score screen */
.score-screen{display:none;background:#fff;border-radius:12px;padding:40px 32px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
.score-screen.show{display:block}
.score-circle{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#0078d4,#00bcf2);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 4px 20px rgba(0,120,212,.35)}
.score-num{font-size:2.4rem;font-weight:700;color:#fff;line-height:1}
.score-total{font-size:.85rem;color:rgba(255,255,255,.8);margin-top:2px}
.score-title{font-size:1.4rem;font-weight:700;color:#1a1a2e;margin-bottom:8px}
.score-comment{font-size:.95rem;color:#555;line-height:1.6;max-width:480px;margin:0 auto 28px}
.score-breakdown{display:flex;justify-content:center;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.breakdown-item{text-align:center}
.breakdown-num{font-size:1.5rem;font-weight:700}
.breakdown-num.c{color:#107c10}
.breakdown-num.w{color:#d13438}
.breakdown-label{font-size:.78rem;color:#888;margin-top:2px}
.score-bar-wrap{max-width:400px;margin:0 auto 32px}
.score-bar-bg{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-bottom:8px}
.score-bar-fill{height:100%;background:linear-gradient(90deg,#0078d4,#00bcf2);border-radius:5px;transition:width .8s ease .2s}
.score-pct{font-size:.85rem;color:#0078d4;font-weight:700;text-align:right}
.btn-retry{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;background:linear-gradient(135deg,#0078d4,#00bcf2);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(0,120,212,.3);transition:opacity .2s,transform .2s}
.btn-retry:hover{opacity:.9;transform:translateY(-1px)}

/* Review table */
.review-section{margin-top:28px;text-align:left}
.review-title{font-size:.95rem;font-weight:700;color:#333;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
.review-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f4f8;font-size:.85rem;cursor:pointer}
.review-row:hover{background:#f8fafc;margin:0 -8px;padding:9px 8px;border-radius:6px}
.review-icon{font-size:1rem;flex-shrink:0}
.review-q{flex:1;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.review-result{font-size:.78rem;font-weight:700;flex-shrink:0}
.review-result.c{color:#107c10}
.review-result.w{color:#d13438}

@media(max-width:600px){
  header h1{font-size:1.35rem}
  .question-card,.progress-section{padding:18px 16px}
  .score-screen{padding:28px 20px}
  .score-breakdown{gap:16px}
  .nav-btn{padding:9px 16px;font-size:.85rem}
  .score-circle{width:100px;height:100px}
  .score-num{font-size:2rem}
}
</style>
</head>
<body>
<header>
  <h1>AI-102 Azure AI Services 基礎クイズ</h1>
  <p>Designing and Implementing a Microsoft Azure AI Solution</p>
</header>
<main>
  <div class="quiz-wrapper">
    <!-- Progress -->
    <div class="progress-section" id="progressSection">
      <div class="progress-header">
        <span class="progress-label">進捗</span>
        <span class="progress-counter" id="progressCounter">1 / 20</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:5%"></div>
      </div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="questionCard">

        <span class="q-badge" id="qBadge">Q1</span>

      </div>

      <div class="result-badge" id="resultBadge">
        <span class="result-icon" id="resultIcon"></span>
        <span id="resultText"></span>
      </div>

      <div class="nav-section">
        <button class="nav-btn btn-prev" id="btnPrev" onclick="navigate(-1)" disabled>← 前へ</button>
        <div class="nav-dots" id="navDots"></div>
        <button class="nav-btn btn-next" id="btnNext" onclick="navigate(1)">次へ →</button>
      </div>

    <!-- Score screen -->
    <div class="score-screen" id="scoreScreen">

        <div class="score-num" id="scoreNum">0</div>

        <div class="breakdown-item">
          <div class="breakdown-num w" id="wrongCount">0</div>
          <div class="breakdown-label">不正解</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-num" id="unansweredCount" style="color:#888">0</div>
          <div class="breakdown-label">未回答</div>
        </div>
      </div>
      <div class="score-bar-wrap">
        <div class="score-bar-bg"><div class="score-bar-fill" id="scoreBarFill" style="width:0%"></div></div>
        <div class="score-pct" id="scorePct">0%</div>
      </div>
      <button class="btn-retry" onclick="resetQuiz()">🔄 もう一度挑戦する</button>

      <div class="review-section">

        <div id="reviewList"></div>
      </div>

  </div>
</main>

<script>
const QUESTIONS = [
  {id:1,question:"Azure AI Servicesのリソースを作成したとき、認証に使われるもんは次のうちどれや？",options:["ユーザー名とパスワード","キー（Key）とエンドポイント（Endpoint）","Azure ADのみ","証明書ファイル"],answer:1,explanation:"Azure AI Servicesは「キー」と「エンドポイント」のペアで認証するんが基本や。キーはリクエストヘッダーに入れて、エンドポイントはアクセス先のURLとして使うで。"},
  {id:2,question:"Azure AI Servicesの「マルチサービスリソース」のメリットは何や？",options:["各サービスごとに別々の課金になる","1つのキーとエンドポイントで複数のAIサービスにアクセスできる","無料で使える","オンプレミスでしか使えへん"],answer:1,explanation:"マルチサービスリソースを使たら、Vision、Language、Speechなんかを1つのキー・エンドポイントでまとめて使えるから管理がラクになる。課金もまとめられるで。"},
  {id:3,question:"Azure AI Servicesのキーが漏洩した可能性があるとき、最初にやるべきことは？",options:["リソースを削除する","キーを再生成（Regenerate）する","サブスクリプションを変更する","何もせんでええ"],answer:1,explanation:"キーは2つ（Key1とKey2）用意されとるから、片方を再生成して切り替えるんが正解や。アプリは無停止で切り替えできるように設計しとくのがベストプラクティスやで。"},
  {id:4,question:"Azure AI Servicesでデータを保存せえへんように設定するには、どの機能を使う？",options:["Customer Managed Key","Private Endpoint","データ保持を無効化する設定（一部サービスで対応）","リソースグループの削除"],answer:2,explanation:"SpeechやLanguageなんかは、入力データをログとして保存せん設定（no logging）ができる。プライバシー要件が厳しいシステムで重宝するで。"},
  {id:5,question:"Azure AI Servicesのリソースを特定の仮想ネットワークからだけアクセスできるようにするには？",options:["キーを変更する","仮想ネットワークとプライベートエンドポイントを設定する","パブリックIPを削除する","リージョンを変更する"],answer:1,explanation:"仮想ネットワーク統合とプライベートエンドポイントでネットワーク制限できる。パブリックインターネットからのアクセスを完全に遮断することも可能やで。"},
  {id:6,question:"Azure AI Visionで画像から物体検出をする機能の名前は？",options:["Object Detection","Sentiment Analysis","Speech Recognition","Translator"],answer:0,explanation:"Azure AI VisionのObject Detectionで物体の位置（バウンディングボックス）と種類を検出できる。画像分類との違いは「位置情報」も返してくれるとこや。"},
  {id:7,question:"Azure AI Language（旧Text Analytics）でテキストの感情を分析する機能は？",options:["Key Phrase Extraction","Sentiment Analysis","Entity Recognition","Language Detection"],answer:1,explanation:"Sentiment Analysisで「ポジティブ／ネガティブ／ニュートラル／ミックス」を判定する。スコア（0〜1）も返してくれるから、確信度も分かるで。"},
  {id:8,question:"音声をテキストに変換するAzureのサービスは？",options:["Azure AI Translator","Azure AI Speech（Speech to Text）","Azure AI Vision","Azure AI Language"],answer:1,explanation:"Speech to TextはAzure AI Speechの機能や。リアルタイム文字起こしやバッチ処理にも対応しとる。"},
  {id:9,question:"Azure AI Servicesを呼び出すときに、リクエストヘッダーに含めるキーの名前は？",options:["Authorization","Ocp-Apim-Subscription-Key","X-API-Key","Bearer-Token"],answer:1,explanation:"Ocp-Apim-Subscription-Key ヘッダーにキーを入れてリクエストする。試験でもようでる定番やで。"},
  {id:10,question:"Azure AI Servicesで、Azure ADを使った認証を有効にするには何を使う？",options:["Managed Identity","Shared Access Signature","ローカルアカウント","パスワード認証"],answer:0,explanation:"Managed Identityを使えばキー不要でAzure AD認証できる。キーの管理が不要になるからセキュアや。"},
  {id:11,question:"Azure AI Servicesリソースの料金プラン「F0」とは何を意味する？",options:["エンタープライズ向け","無料プラン（Free Tier）","有料プラン（Standard）","試用版（30日限定）"],answer:1,explanation:"F0は無料プラン（Free Tier）。月間の呼び出し回数に上限があるけど、検証や学習にはピッタリや。S0などが有料Standardプランやで。"},
  {id:12,question:"Azure AI Servicesで使用状況を監視するためのAzureの標準サービスは？",options:["Azure Monitor","Azure Backup","Azure DevOps","Azure Functions"],answer:0,explanation:"Azure Monitorでメトリクス、ログ、アラートを設定できる。API呼び出し数やエラー率なんかをダッシュボードで可視化できるで。"},
  {id:13,question:"Azure AI Vision の OCR（光学文字認識）機能で使われるAPIは？",options:["Read API","Detect API","Analyze API","Translate API"],answer:0,explanation:"Read APIが手書きや印刷文字のOCRに使われる。多言語対応で、PDFや画像から高精度にテキスト抽出できるで。"},
  {id:14,question:"Azure AI Translatorで対応してへん機能は次のうちどれ？",options:["テキスト翻訳","ドキュメント翻訳","画像内の物体検出","カスタム翻訳モデル"],answer:2,explanation:"物体検出はAI Visionの機能やからな。TranslatorはあくまでテキストやドキュメントのNeural Machine Translation専門や。"},
  {id:15,question:"Azure AI Servicesのコンテナーを使うメリットは？",options:["クラウドでしか動かへん","オンプレミスやエッジ環境で実行できる","課金が発生せえへん","キーが要らんなる"],answer:1,explanation:"コンテナー版はオンプレやエッジで動かせて、データを外に出さんで済む。ただし課金は発生するし、キーも必要やで。"},
  {id:16,question:"Azure AI Language の「Question Answering」機能の用途は？",options:["画像分類","FAQやナレッジベースから質問に答える","音声合成","動画分析"],answer:1,explanation:"Question AnsweringはFAQボットなんかでよう使われる。旧QnA Makerの後継機能で、ナレッジベースを作って質問応答できるで。"},
  {id:17,question:"Azure AI Servicesで、責任あるAI（Responsible AI）の原則に含まれへんもんは？",options:["公平性（Fairness）","透明性（Transparency）","プライバシーとセキュリティ","最大の収益化"],answer:3,explanation:"収益化は原則に含まれへん。Microsoftの責任あるAIの6原則は「公平性、信頼性と安全性、プライバシーとセキュリティ、包括性、透明性、説明責任」やで。"},
  {id:18,question:"Azure AI Servicesのリソースを作成するときに必須の設定は？",options:["リージョン、価格レベル、リソースグループ","クレジットカード番号","公開鍵証明書","SSH鍵"],answer:0,explanation:"リージョン、価格レベル、リソースグループ、リソース名が基本の必須項目。リージョンは後から変えられへんから慎重に選ぶんやで。"},
  {id:19,question:"Azure AI Speech の「Text to Speech」で、独自の音声を作成する機能は？",options:["Custom Voice（Custom Neural Voice）","Speech Translation","Speaker Recognition","Pronunciation Assessment"],answer:0,explanation:"Custom Neural Voiceで独自のブランドボイス作れるで。利用には申請と承認が必要で、悪用防止のための審査があるんや。"},
  {id:20,question:"Azure AI ServicesのSDKを使うとき、推奨される認証方法は？",options:["キーをソースコードにハードコーディング","Azure Key Vaultにキーを保管して取得する、またはManaged Identityを使う","公開リポジトリにキーをコミット","メールでキーを共有する"],answer:1,explanation:"キーのハードコーディングはアカン。Key VaultやManaged Identityを使うんがベストプラクティス。GitHubに誤ってキーをpushする事故もよくあるから注意やで。"}
];

const KEYS = ['A','B','C','D'];
const SCORE_COMMENTS = [
  {min:0,  max:9,  title:"もう少し頑張ろう！",  comment:"基礎をしっかり固めていこう。公式ドキュメントや学習リソースを活用して、もう一度チャレンジや！"},
  {min:10, max:13, title:"もう一息！",            comment:"半分以上は正解やったで！あと少し復習して試験に臨んだら合格も見えてくるで。"},
  {min:14, max:16, title:"なかなかええやん！",   comment:"かなりの実力やで。苦手な分野をピンポイントで復習したら満点も狙えるで！"},
  {min:17, max:19, title:"ほぼ完璧！",           comment:"素晴らしい出来や！細かいとこを少し確認したら試験もバッチリやで！"},
  {min:20, max:20, title:"満点！完璧や！🎉",     comment:"全問正解やで！AI-102試験の基礎は完全にマスターしとるで。自信持って本番に挑もう！"}
];

let current = 0;
let userAnswers = new Array(QUESTIONS.length).fill(null);

function init() {
  buildNavDots();
  renderQuestion(0);
}

function buildNavDots() {
  const container = document.getElementById('navDots');
  container.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'nav-dot' + (i === 0 ? ' current' : '');
    dot.title = `Q${i+1}`;
    dot.onclick = () => goTo(i);
    container.appendChild(dot);
  });
}

function updateNavDots() {
  const dots = document.querySelectorAll('.nav-dot');
  dots.forEach((dot, i) => {
    dot.className = 'nav-dot';
    if (i === current) dot.classList.add('current');
    if (userAnswers[i] !== null) {
      const isCorrect = userAnswers[i] === QUESTIONS[i].answer;
      dot.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });
}

function renderQuestion(idx) {
  current = idx;
  const q = QUESTIONS[idx];
  const answered = userAnswers[idx];
  const total = QUESTIONS.length;

  document.getElementById('qBadge').textContent = `Q${idx+1}`;
  document.getElementById('qText').textContent = q.question;
  document.getElementById('progressCounter').textContent = `${idx+1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((idx+1)/total)*100}%`;

  // Options
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-key">${KEYS[i]}</span><span class="option-text">${opt}</span>`;
    if (answered !== null) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === answered) btn.classList.add('wrong');
      else btn.classList.add('neutral');
    } else {
      btn.onclick = () => selectAnswer(i);
    }
    container.appendChild(btn);
  });

  // Result + explanation
  const badge = document.getElementById('resultBadge');
  const expl = document.getElementById('explanation');
  if (answered !== null) {
    const correct = answered === q.answer;
    badge.className = 'result-badge show ' + (correct ? 'ok' : 'ng');
    document.getElementById('resultIcon').textContent = correct ? '✅' : '❌';
    document.getElementById('resultText').textContent = correct
      ? `正解や！「${KEYS[q.answer]}: ${q.options[q.answer]}」やで。`
      : `不正解。正解は「${KEYS[q.answer]}: ${q.options[q.answer]}」やで。`;
    expl.className = 'explanation show';
    expl.innerHTML = `<strong>解説：</strong> ${q.explanation}`;
  } else {
    badge.className = 'result-badge';
    expl.className = 'explanation';
  }

  // Nav buttons
  document.getElementById('btnPrev').disabled = idx === 0;
  const nextBtn = document.getElementById('btnNext');
  if (idx === total - 1) {
    nextBtn.textContent = '結果を見る →';
    nextBtn.onclick = showScore;
  } else {
    nextBtn.textContent = '次へ →';
    nextBtn.onclick = () => navigate(1);
  }

  updateNavDots();
}

function selectAnswer(optIdx) {
  userAnswers[current] = optIdx;
  renderQuestion(current);
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < QUESTIONS.length) renderQuestion(next);
}

function goTo(idx) {
  renderQuestion(idx);
}

function showScore() {
  const correct = userAnswers.filter((a, i) => a === QUESTIONS[i].answer).length;
  const wrong = userAnswers.filter((a, i) => a !== null && a !== QUESTIONS[i].answer).length;
  const unanswered = userAnswers.filter(a => a === null).length;
  const pct = Math.round((correct / QUESTIONS.length) * 100);

  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('questionCard').style.display = 'none';
  const scoreScreen = document.getElementById('scoreScreen');
  scoreScreen.className = 'score-screen show';

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('unansweredCount').textContent = unanswered;
  document.getElementById('scorePct').textContent = `正解率 ${pct}%`;
  setTimeout(() => { document.getElementById('scoreBarFill').style.width = pct + '%'; }, 50);

  const comment = SCORE_COMMENTS.find(c => correct >= c.min && correct <= c.max);
  document.getElementById('scoreTitle').textContent = comment.title;
  document.getElementById('scoreComment').textContent = comment.comment;

  // Review list
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const a = userAnswers[i];
    const isCorrect = a === q.answer;
    const row = document.createElement('div');
    row.className = 'review-row';
    row.innerHTML = `
      <span class="review-icon">${a === null ? '⬜' : isCorrect ? '✅' : '❌'}</span>
      <span class="review-q">Q${i+1}. ${q.question}</span>
      <span class="review-result ${a === null ? '' : isCorrect ? 'c' : 'w'}">${a === null ? '未回答' : isCorrect ? '正解' : '不正解'}</span>
    `;
    row.onclick = () => jumpToQuestion(i);
    list.appendChild(row);
  });
}

function jumpToQuestion(idx) {
  document.getElementById('progressSection').style.display = '';
  document.getElementById('questionCard').style.display = '';
  document.getElementById('scoreScreen').className = 'score-screen';
  renderQuestion(idx);
}

function resetQuiz() {
  userAnswers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  document.getElementById('progressSection').style.display = '';
  document.getElementById('questionCard').style.display = '';
  document.getElementById('scoreScreen').className = 'score-screen';
  buildNavDots();
  renderQuestion(0);
}

init();
</script>
</body>
</html>
